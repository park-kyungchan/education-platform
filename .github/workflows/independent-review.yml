name: Independent review
# Runs from the trusted base (pull_request_target): a pull request cannot change its own review job, prompt or judge.
# The head is checked out as data only; no step executes code from it. Add the full-review label to a final candidate.
# The job never skips: GitHub counts a skipped required job as success, so an unrequested review fails instead.
# Threat model: outside contributors and accidents (re-run, re-label, concurrent requests, skips). Accounts with write
# access act with the owner's admin token and could change the ruleset itself; their deliberate forgery is out of scope.
# Concurrency is per head and never cancels, so a second request for a head waits and then reuses the first verdict.
on:
  pull_request_target:
    types: [opened, labeled, synchronize, reopened]
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: independent-review-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  review:
    name: Independent exact-head review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out exact head as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Require a same-repository head and the full-review label
        run: bun trusted/scripts/independent-review.ts request
      - name: Reuse the first verdict for this head
        id: prior
        run: bun trusted/scripts/independent-review.ts prior review-input
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build review input
        if: ${{ steps.prior.outputs.found == 'false' }}
        run: bun trusted/scripts/independent-review.ts prepare subject review-input
      - name: Review
        if: ${{ steps.prior.outputs.found == 'false' }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: review-input/prompt.md
          working-directory: ${{ github.workspace }}/subject
          model: gpt-6.1-sol
          effort: high
          permission-profile: ':read-only'
          output-schema-file: trusted/ci/independent-review/schema.json
          output-file: review-input/verdict.json
          codex-args: '["-c", "project_doc_max_bytes=0"]'
      - name: Keep the verdict for this head
        if: ${{ steps.prior.outputs.found == 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-review-verdict-${{ github.event.pull_request.head.sha }}
          path: review-input/verdict.json
          if-no-files-found: error
          retention-days: 90
      - name: Judge
        run: bun trusted/scripts/independent-review.ts judge review-input/verdict.json
