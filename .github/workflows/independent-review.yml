name: Independent review
# Runs on pull_request_target from the default branch: a pull request cannot change its own review job, prompt or judge.
# The head is checked out as data only; no step executes code from it. Every ready (non-draft) pull request is reviewed;
# mark a pull request as draft to hold reviews. The verdict is the commit status "Independent exact-head review" on the
# exact head; the owner merges only after it succeeds (the ruleset requires no status check, user decision 2026-10-30).
# This job's own check lands on the default-branch commit, so it is named differently from the verdict context.
# The status is posted by the review GitHub App and the job refuses a status from any other creator, so a same-named
# check from a fork job or any other workflow is never read as a verdict. Statuses cannot be deleted:
# the first status for a head is final, and a pending one left by a cancelled run fails closed instead of sampling again.
# Threat model: outside contributors and accidents (re-run, concurrent requests, skips). Accounts with write
# access act with the owner's admin token and could change the ruleset itself; their deliberate forgery is out of scope.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  statuses: read
  actions: read
  pull-requests: read
concurrency:
  group: independent-review-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  review:
    name: Independent review runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out exact head as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Require a ready same-repository pull request into the default branch
        run: bun trusted/scripts/independent-review.ts request
      - name: Mint the review app token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-statuses: write
      - name: Claim the one review of this head
        id: claim
        run: bun trusted/scripts/independent-review.ts claim
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
      - name: Build review input
        if: ${{ steps.claim.outputs.sample == 'true' }}
        run: bun trusted/scripts/independent-review.ts prepare subject review-input
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Review
        id: review
        if: ${{ steps.claim.outputs.sample == 'true' }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: review-input/prompt.md
          working-directory: ${{ github.workspace }}/subject
          model: gpt-6.1-sol
          effort: high
          permission-profile: ':read-only'
          output-schema-file: trusted/ci/independent-review/schema.json
          output-file: review-input/verdict.json
          codex-args: '["-c", "project_doc_max_bytes=0"]'
      - name: Record the verdict on the head
        if: ${{ !cancelled() && steps.claim.outputs.sample == 'true' }}
        run: bun trusted/scripts/independent-review.ts record review-input/verdict.json
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
