name: Month-end frontend preview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed synthetic frontend to GitHub Pages
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: month-end-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Test and build only the public synthetic preview
        working-directory: apps/academy/month-end-web
        run: |
          bun run test
          bun run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/academy/month-end-web/dist
  deploy:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
