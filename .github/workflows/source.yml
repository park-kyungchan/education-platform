name: Source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Canonical source checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify generated CI projection and scoped module integration
        uses: park-kyungchan/agent-platform/.github/actions/bun-source@f6649663fb78261de2499f0920306c32f5e22f1f
        with:
          project-id: education-platform
          repository: park-kyungchan/education-platform
          source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          bun-version: 1.4.3
          install-dependencies: 'false'
          scripts: '["setup","check:ci-projection","check"]'
      - name: Start disposable Postgres for the complete native source plan
        run: |
          mkdir -m 777 "$RUNNER_TEMP/native-plan-socket"
          docker run --detach --rm --name native-plan-source-postgres --network none \
            -e POSTGRES_USER=e2e_qualification -e POSTGRES_DB=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$RUNNER_TEMP/native-plan-socket:/var/run/postgresql" \
            postgres@sha256:ec4dfc6571f04fe0731ce948c1500d676af49a7224392dcc6995cc1ee33a94bb
          for attempt in $(seq 1 60); do
            if docker exec native-plan-source-postgres pg_isready -U e2e_qualification -d postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Replay all 32 native plan steps through the real source store
        env:
          NATIVE_PLAN_PG_SOCKET: ${{ runner.temp }}/native-plan-socket
        run: bun test --timeout 900000 apps/academy/dc-gang-a/tests/academy/isolatedNativeServer.test.ts -t 'NATIVE-PLAN all 32'
      - name: Stop the disposable source-plan provider
        if: ${{ always() }}
        run: docker stop --time 10 native-plan-source-postgres
  native-review:
    name: Exact head native independent review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Verify generated owner review closure
        run: bun ci/verify-projection.ts
      - name: Read immutable native review receipt for this exact head
        run: bun ci/native-review-gate.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  source-gate:
    name: Source and native review gate
    if: ${{ always() }}
    needs: [source, native-review]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require both source checks and exact head native review
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          REVIEW_RESULT: ${{ needs.native-review.result }}
        run: test "$SOURCE_RESULT" = success && test "$REVIEW_RESULT" = success
