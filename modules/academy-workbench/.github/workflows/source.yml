name: Source verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Academy source and synthetic checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AGENT_PLATFORM_SOURCE_MODE: pinned-snapshot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.14.1
      - name: Shared execution of Academy-owned source checks
        uses: park-kyungchan/agent-platform/.github/actions/bun-source@f6649663fb78261de2499f0920306c32f5e22f1f
        with:
          project-id: academy-workbench
          repository: park-kyungchan/academy-workbench
          source-sha: ${{ github.event.pull_request.head.sha || github.sha }}
          bun-version: 1.4.3
          scripts: '["setup:ci", "check", "check:ci", "test", "test:synthetic-runtime", "test:offline-adapter", "context:inspect"]'
  native-review:
    name: Exact head owner-scoped native independent review
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Verify generated projection
        run: bun ci/verify-projection.ts
      - name: Read authenticated immutable owner review for exact head
        run: bun ci/generated/native-review-gate.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  source-gate:
    name: Academy source and native review gate
    if: ${{ always() }}
    needs: [source, native-review]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require source checks and exact head review
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          REVIEW_RESULT: ${{ needs.native-review.result }}
        run: test "$SOURCE_RESULT" = success && test "$REVIEW_RESULT" = success
