<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"><title>v21 합성 반응형 검수</title><style>body{margin:0;background:#e6e3dc;color:#18342b;font:14px/1.4 sans-serif}header{padding:12px 16px;background:#fff;position:sticky;top:0;z-index:5}h1{font-size:18px;margin:0 0 8px}button{font:inherit;padding:8px 12px;margin:0 5px 5px 0;border:1px solid #78847b;border-radius:5px;background:#fff;cursor:pointer}button[aria-pressed=true]{background:#183b30;color:#fff}p{margin:4px 0}#metrics{font-family:monospace;white-space:pre-wrap}main{padding:12px;overflow:auto}iframe{display:block;width:1440px;height:1000px;border:1px solid #9a9a8d;background:white;box-shadow:0 3px 15px #0001}small{display:block}</style></head><body><header><h1>실제 v21 UI + 완전 합성 데이터</h1><div id="sizes"><button type="button" data-width="1440" aria-pressed="true">PC 1440 px</button><button type="button" data-width="1100" aria-pressed="false">경계 1100 px</button><button type="button" data-width="1099" aria-pressed="false">경계 1099 px</button><button type="button" data-width="768" aria-pressed="false">768 px</button><button type="button" data-width="390" aria-pressed="false">390 px</button><button type="button" data-width="320" aria-pressed="false">320 px</button><button id="read" type="button">실측 갱신</button></div><p>같은 앱을 담은 iframe 폭 검수입니다. 실제 모바일 기기·터치·Safari 검증이 아닙니다.</p><small>실제 학생/학원 API 0 · native WebMCP/로그인 미검증 · 원본 v21 CSS 그대로</small><p id="metrics" aria-live="polite">렌더링 대기</p></header><main><iframe src="./index.html" title="합성 학원 full-app 반응형 검수" sandbox="allow-scripts allow-same-origin"></iframe></main><script>const frame=document.querySelector('iframe'),metrics=document.querySelector('#metrics');function read(){try{const q=frame.contentWindow.SYNTHETIC_QA;const m=q?.dimensions();metrics.textContent=m?JSON.stringify(m):'렌더링 대기';}catch(e){metrics.textContent=String(e)}}frame.addEventListener('load',()=>{read();setTimeout(read,150)});document.querySelector('#read').addEventListener('click',read);document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));frame.style.width=b.dataset.width+'px';frame.style.height=Number(b.dataset.width)<1100?'844px':'1000px';setTimeout(read,200)}));</script></body></html>
