al-add","edgeType":"required_prerequisite","justification":"분수로 표시한 유리수의 단위를 맞춘다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-9","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"lcm","toId":"common-denominator","edgeType":"helpful_prerequisite","justification":"가장 작은 공통 분모를 선택하는 효율화 관계이며 필수 선수로 단정하지 않는다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-10","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"fraction-notation","toId":"rational","edgeType":"representation","justification":"분수 표기가 유리수를 나타내는 표현으로 확장된다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-11","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"fraction-add","toId":"rational-add","edgeType":"related","justification":"양의 분수 덧셈과 부호 있는 수의 덧셈을 연결한다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-12","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"exponents","toId":"square-roots","edgeType":"related","justification":"제곱 연산과 역방향 관계를 연결하되 전체 지수법칙을 필수 선수로 단정하지 않는다.","evidenceStatus":"pedagogical_hypothesis"}],"gaps":[{"kind":"qa_gap","id":"curriculum-mapping","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"title":"교육과정 대응 미확정","description":"별책 8의 성취기준 원문과 개념별 대응을 아직 확정하지 않았다. 학년 표시는 UI 배치 제안이다.","conceptIds":["multiple","common-multiple","lcm","fraction-notation","equivalent-fractions","common-denominator","fraction-add","fraction-divide","rational","rational-add","exponents","square-roots"],"severity":"review","resolution":"open"},{"kind":"qa_gap","id":"fraction-divide-prereq","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"title":"분수 나눗셈 선수 누락","description":"분수 곱셈, 나눗셈의 의미, 곱셈 역원의 설명 노드가 추가로 필요하다.","conceptIds":["fraction-divide"],"severity":"review","resolution":"open"},{"kind":"qa_gap","id":"signed-number-prereq","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"title":"부호 연산 선수 누락","description":"정수, 수직선, 절댓값, 반대수 노드는 후속 확장 대상이다.","conceptIds":["rational","rational-add"],"severity":"review","resolution":"open"},{"kind":"qa_gap","id":"power-prereq","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"title":"거듭제곱 선수 누락","description":"거듭제곱 정의와 곱셈의 결합법칙 노드를 추가로 연결해야 한다.","conceptIds":["exponents"],"severity":"review","resolution":"open"},{"kind":"qa_gap","id":"root-prereq","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"title":"제곱근 선수 누락","description":"제곱, 음이 아닌 실수, 무리수 노드의 상세를 추가해야 한다.","conceptIds":["square-roots"],"severity":"review","resolution":"open"},{"kind":"qa_gap","id":"not-full-map","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"title":"전체 범위 미구축","description":"12개 개념만 포함하며 기하, 통계 등 전체 교과 범위를 대표하지 않는다.","conceptIds":[],"severity":"review","resolution":"open"}],"sources":[{"kind":"source","id":"src-author","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":[],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"sourceType":"author_constructed","title":"화면 비교용 직접 작성 수학 예시","url":null,"authority":"prototype","note":"선수 관계는 교수학적 가설이며 공식 교육과정 그래프가 아님"},{"kind":"source","id":"src-moe","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":[],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"sourceType":"official_overview","title":"교육부 2022 개정 교육과정 확정 발표","url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=93459&lev=0&searchType=null","authority":"official_overview_only","note":"교육과정의 배경만 지원하며 개념별 성취기준 대응은 지원하지 않음"},{"kind":"source","id":"src-space","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":[],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"sourceType":"official_product_documentation","title":"Getting started with Space","url":"https://help.openai.com/en/articles/20001549-getting-started-with-space-in-chatgpt","authority":"official_product","note":"중첩 Page와 편집 문서, 상호작용 도구를 지원함"}],"viewContract":{"kind":"view_contract","canonicalSource":"matheducation-sample-r2.json","schema":"matheducation-sample-r2.schema.json","mode":"embedded_snapshot","liveFileSync":false,"editsInViewWriteSource":false,"selectionPersistence":"local_only","hierarchySeparateFromDependencies":true,"privacy":"owner_only_no_student_data"}}</script>
  <script>
  (() => {
    const root=document.getElementById('math-explorer');
    const data=JSON.parse(root.querySelector('#me-data').textContent);
    const concepts=new Map(data.concepts.map(c=>[c.id,c]));
    const groups=new Map(data.groups.map(g=>[g.id,g]));
    const el=root.querySelector('.me-main');
    let selected='common-denominator', view='detail';const edgeShown={helpful_prerequisite:false,representation:false,related:false};
    const esc=x=>String(x).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const title=id=>concepts.get(id)?.title||id;
    const node=id=>`<button class="me-node" type="button" data-node="${esc(id)}">${esc(title(id))}</button>`;
    root.querySelector('.me-tree').innerHTML=data.groups.filter(g=>g.kind==='topic').map(g=>`<details open><summary>${esc(g.title)}</summary>${data.concepts.filter(c=>c.canonicalParentId===g.id).map(c=>`<button type="button" data-node="${esc(c.id)}" aria-pressed="${c.id===selected}">${esc(c.title)}</button>`).join('')}</details>`).join('');
    function header(c){return `<div class="me-path">수학 개념 샘플 / ${esc(groups.get(c.canonicalParentId).title)}</div><h2>${esc(c.title)}</h2><span class="me-badge">${esc(c.stage)} 배치 제안</span><span class="me-badge">concept</span><span class="me-badge">${esc(c.id)}</span>`;}
    function detail(c){return header(c)+`<p class="me-meaning">${esc(c.meaning)}</p><h3>용어의 의미</h3><dl class="me-definition">${c.terms.map(t=>`<dt>${esc(t.label)}</dt><dd>${esc(t.meaning)}</dd>`).join('')}</dl><h3>기호의 의미와 범위</h3>${c.symbols.map(s=>`<div class="me-symbol"><div class="me-notation">${esc(s.notation)}</div><div>${esc(s.meaning)}</div><div class="me-caption">${esc(s.scope)}</div></div>`).join('')}<h3>적용 조건</h3><ul>${c.conditions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><h3>확인 예시</h3><div class="me-example">${esc(c.example)}</div><div class="me-warning">주의 · ${esc(c.misconception)}</div>${c.advancedLens?`<details class="me-advanced"><summary>대학 수준 해설</summary><h3>${esc(c.advancedLens.statement)}</h3><div>${esc(c.advancedLens.proof)}</div><div class="me-caption">사용자용 설명 관점 · 학생의 교육과정 선수 요건에 포함하지 않음</div></details>`:""}`;}
    function relations(c){const incoming=data.dependencyEdges.filter(e=>e.edgeType==='required_prerequisite'&&e.toId===c.id);const outgoing=data.dependencyEdges.filter(e=>e.edgeType==='required_prerequisite'&&e.fromId===c.id);const other=data.dependencyEdges.filter(e=>e.edgeType!=='required_prerequisite'&&(e.toId===c.id||e.fromId===c.id));return header(c)+`<div class="me-flow"><div><div class="me-col-label">필수 선행</div>${incoming.map(e=>node(e.fromId)).join('')||'<div class="me-empty">샘플에 연결 없음</div>'}</div><div class="me-arrow">→</div><div class="me-flow-center">${esc(c.title)}</div><div class="me-arrow">→</div><div><div class="me-col-label">필수 후속</div>${outgoing.map(e=>node(e.toId)).join('')||'<div class="me-empty">샘플에 연결 없음</div>'}</div></div><h3>필수 선행 관계의 이유</h3>${incoming.concat(outgoing).map(e=>`<div class="me-relation">${esc(title(e.fromId))} → ${esc(title(e.toId))}<div class="me-caption">${esc(e.justification)}</div></div>`).join('')||'<div class="me-empty">선수 관계가 없다는 뜻은 아닙니다. 미구축 항목은 검증 화면에서 확인합니다.</div>'}<h3>추가 연결 보기</h3><div class="me-toggles">${[['helpful_prerequisite','도움되는 선행'],['representation','다른 표현'],['related','관련 개념']].map(([k,v])=>`<label><input type="checkbox" data-edge="${k}" ${edgeShown[k]?'checked':''}> ${v}</label>`).join(' · ')}</div>${other.filter(e=>edgeShown[e.edgeType]).map(e=>`<div class="me-relation"><span class="me-badge">${{helpful_prerequisite:'도움되는 선행',representation:'다른 표현',related:'관련 개념'}[e.edgeType]}</span><button type="button" data-node="${esc(e.fromId===c.id?e.toId:e.fromId)}">${esc(title(e.fromId===c.id?e.toId:e.fromId))}</button><div class="me-caption">${esc(e.justification)}</div></div>`).join('')||'<div class="me-empty">기본 화면에는 필수 선행만 표시합니다.</div>'}<div class="me-warning">선수 관계는 교수학적 가설입니다. 분류 위계나 공식 성취기준의 순서와 같지 않습니다.</div>`;}
    function qa(){return `<div class="me-path">구조 검증 / 내용 검토</div><h2>검증과 빈칸</h2><span class="me-badge">JSON Schema 통과</span><span class="me-badge">선수 그래프 순환 없음</span><h3>남은 검토 ${data.gaps.length}개</h3>${data.gaps.map(g=>`<div class="me-qa"><strong>${esc(g.title)}</strong><div>${esc(g.description)}</div>${g.conceptIds.length&&g.conceptIds.length<5?`<div class="me-relation">${g.conceptIds.map(id=>`<button type="button" data-node="${esc(id)}" data-open-detail="true">${esc(title(id))}</button>`).join(' · ')}</div>`:''}</div>`).join('')}<h3>원본과 화면의 관계</h3><div class="me-caption">JSON → 검증 → 화면 생성. 원본 파일을 바꾸면 화면을 다시 생성해야 합니다. 자동 양방향 동기화나 학습 완료 판정은 연결하지 않았습니다.</div>`;}
    function render(){const c=concepts.get(selected);el.innerHTML=view==='detail'?detail(c):view==='relations'?relations(c):qa();el.setAttribute('aria-labelledby','me-tab-'+view);root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));root.querySelectorAll('.me-tree [data-node]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.node===selected)));}
    root.addEventListener('change',e=>{if(e.target.dataset.edge){edgeShown[e.target.dataset.edge]=e.target.checked;render();}});
    root.addEventListener('click',e=>{const tab=e.target.closest('[data-view]');const item=e.target.closest('[data-node]');if(tab){view=tab.dataset.view;render();}else if(item){selected=item.dataset.node;if(view==='qa'||item.dataset.openDetail)view='detail';render();}});
    render();
  })();
  </script>
</div>
