  <script type="application/json" id="math-spatial-config">{"kind":"math_ui_config","schemaVersion":"1.0.0","id":"matheducation-spatial-atlas","variant":"spatial_semantic_zoom","source":{"file":"matheducation-sample-r2.json","sha256":"3332d52420632f5a5afc872692f9a9bfcd81d238705d8d63918c0c9a70118308","revision":2,"embedding":"exact_utf8_source_bytes","mutable":false,"conceptIds":["multiple","common-multiple","lcm","fraction-notation","equivalent-fractions","common-denominator","fraction-add","fraction-divide","rational","rational-add","exponents","square-roots"],"topicIds":["natural","fractions","rational-domain","algebra","real-domain"]},"navigation":{"initialLevel":"overview","levels":["overview","group","concept"],"breadcrumb":true,"backBehavior":"canonical_parent_one_level","homeBehavior":"clear_selection_return_overview","dependencyJump":"select_target_and_its_canonical_topic","statePersistence":"in_memory_only","atomDisclosure":"native_details_open_by_default"},"dependencies":{"defaultVisible":["required_prerequisite"],"optional":["helpful_prerequisite","representation","related"],"requiredAlwaysVisible":true,"overviewEdges":"hidden","groupEdges":"within_group_required_only","conceptEdges":"incident_in_side_panel","universityLenses":"separate_disclosure_not_prerequisites","evidenceLabel":"pedagogical_hypothesis"},"topics":[{"topicId":"natural","columnStart":1,"columnSpan":4,"rowStart":1,"rowSpan":1},{"topicId":"fractions","columnStart":5,"columnSpan":5,"rowStart":1,"rowSpan":2},{"topicId":"rational-domain","columnStart":10,"columnSpan":3,"rowStart":1,"rowSpan":1},{"topicId":"algebra","columnStart":1,"columnSpan":4,"rowStart":2,"rowSpan":1},{"topicId":"real-domain","columnStart":10,"columnSpan":3,"rowStart":2,"rowSpan":1}],"scaffoldRegions":[{"id":"scaffold-geometry","label":"기하","status":"unpopulated_ui_scaffold","conceptIds":[],"columnStart":1,"columnSpan":4},{"id":"scaffold-statistics","label":"통계","status":"unpopulated_ui_scaffold","conceptIds":[],"columnStart":5,"columnSpan":4},{"id":"scaffold-extended","label":"그 밖의 확장 영역","status":"unpopulated_ui_scaffold","conceptIds":[],"columnStart":9,"columnSpan":4}],"conceptPositions":[{"conceptId":"multiple","x":17,"y":50,"mobileX":50,"mobileY":18},{"conceptId":"common-multiple","x":50,"y":50,"mobileX":50,"mobileY":50},{"conceptId":"lcm","x":83,"y":50,"mobileX":50,"mobileY":82},{"conceptId":"fraction-notation","x":25,"y":19,"mobileX":26,"mobileY":17},{"conceptId":"equivalent-fractions","x":72,"y":19,"mobileX":74,"mobileY":17},{"conceptId":"common-denominator","x":49,"y":50,"mobileX":50,"mobileY":50},{"conceptId":"fraction-add","x":27,"y":82,"mobileX":26,"mobileY":83},{"conceptId":"fraction-divide","x":76,"y":82,"mobileX":74,"mobileY":83},{"conceptId":"rational","x":30,"y":50,"mobileX":50,"mobileY":28},{"conceptId":"rational-add","x":70,"y":50,"mobileX":50,"mobileY":72},{"conceptId":"exponents","x":50,"y":50,"mobileX":50,"mobileY":50},{"conceptId":"square-roots","x":50,"y":50,"mobileX":50,"mobileY":50}],"coverage":{"conceptCount":12,"topicCount":5,"fullCurriculum":false,"gradeMapping":"proposed_not_standard_mapped","scaffoldsAreCurriculumTaxonomy":false},"runtime":{"rootId":"math-spatial-atlas","network":false,"backend":false,"sourceWrites":false,"automaticSync":false,"widgetStateSync":false,"externalLibraries":[]}}</script>
  <script>
  (() => {
    'use strict';
    const root = document.getElementById('math-spatial-atlas');
    if (!root) return;
    const deepFreeze = value => { if (value && typeof value === 'object') { Object.values(value).forEach(deepFreeze); Object.freeze(value); } return value; };
    const data = deepFreeze(JSON.parse(document.getElementById('math-spatial-source').textContent));
    const config = deepFreeze(JSON.parse(document.getElementById('math-spatial-config').textContent));
    const byConcept = new Map(data.concepts.map(c => [c.id, c]));
    const byTopic = new Map(data.groups.filter(g => g.kind === 'topic').map(g => [g.id, g]));
    const relationLabels = {required_prerequisite:'필수 선행', helpful_prerequisite:'도움되는 선행', representation:'다른 표현', related:'관련 개념'};
    const state = {level:'overview', topicId:null, conceptId:null, visibleEdges:new Set(config.dependencies.defaultVisible)};
    const content = root.querySelector('[data-region="content"]');
    const breadcrumb = root.querySelector('[data-region="breadcrumb"]');
    const announcement = root.querySelector('[data-region="announcement"]');
    const escape = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const conceptsIn = id => data.concepts.filter(c => c.canonicalParentId === id);
    const visibleEdges = () => data.dependencyEdges.filter(edge => state.visibleEdges.has(edge.edgeType));
    const heading = (level,title,subtitle) => `<div class="ma-heading"><div><div class="ma-level">${level}</div><h2>${escape(title)}</h2><p>${escape(subtitle)}</p></div></div>`;
    const action = (name,id,label,extra='') => `<button type="button" class="cursor-interaction" data-action="${name}" data-id="${escape(id)}" ${extra}>${escape(label)}</button>`;
    function overviewHtml(){
      const regions = config.topics.map(layout => {
        const topic = byTopic.get(layout.topicId); const concepts = conceptsIn(topic.id); const stages = [...new Set(concepts.map(c => c.stage))];
        return `<button type="button" class="ma-region cursor-interaction" data-topic="${topic.id}" data-action="topic" data-id="${topic.id}" style="grid-column:${layout.columnStart}/span ${layout.columnSpan};grid-row:${layout.rowStart}/span ${layout.rowSpan}" aria-label="${escape(topic.title)} 영역 확대, 샘플 개념 ${concepts.length}개"><span class="ma-region-title">${escape(topic.title)}</span><span class="ma-region-count">샘플 ${concepts.length}개</span><span class="ma-region-concepts">${concepts.map(c=>`<span>${escape(c.title)}</span>`).join('')}</span><span class="ma-region-stage">학년 배치 제안 · ${escape(stages.join(', '))}</span><span class="ma-region-open">영역 확대 ↗</span></button>`;
      }).join('');
      const scaffolds = config.scaffoldRegions.map(s => `<section class="ma-empty-region" style="grid-column:${s.columnStart}/span ${s.columnSpan};grid-row:3" aria-label="${escape(s.label)} 미구축 확장 영역"><strong>${escape(s.label)}</strong><span>미구축 · 개념 0개 · 확장 자리</span></section>`).join('');
      return heading('전체 지도 / 영역을 골라 확대','큰 그림에서 개념으로','현재 다섯 영역의 12개 개념을 둘러보세요.') + `<div class="ma-atlas" aria-label="다섯 샘플 영역과 미구축 확장 영역">${regions}${scaffolds}</div><div class="ma-atlas-caption">영역 위치는 탐색용 배치입니다. 선수관계는 영역과 개념을 펼쳤을 때 표시합니다. 회색 확장 자리는 교과 범위나 학년 대응이 확정된 분류가 아닙니다.</div>`;
    }
    function groupHtml(){
      const topic=byTopic.get(state.topicId); const concepts=conceptsIn(topic.id); const conceptIds=new Set(concepts.map(c=>c.id));
      const edges=data.dependencyEdges.filter(e=>e.edgeType==='required_prerequisite'&&conceptIds.has(e.fromId)&&conceptIds.has(e.toId));
      const nodes = concepts.map(c=>{
        const p=config.conceptPositions.find(x=>x.conceptId===c.id); const missing=data.gaps.some(g=>g.id!=='curriculum-mapping' && g.conceptIds.includes(c.id));
        return `<button type="button" class="ma-node cursor-interaction" data-action="concept" data-id="${c.id}" data-node="${c.id}" style="--ma-x:${p.x}%;--ma-y:${p.y}%;--ma-mobile-x:${p.mobileX}%;--ma-mobile-y:${p.mobileY}%" aria-label="${escape(c.title)} 개념 펼치기"><strong>${escape(c.title)}</strong><small>용어 ${c.terms.length} · 기호 ${c.symbols.length}${missing?' · 선수 미완성':''}</small></button>`;
      }).join('');
      const edgeList = edges.length ? edges.map(e=>`<li>${escape(byConcept.get(e.fromId).title)} → ${escape(byConcept.get(e.toId).title)} · ${relationLabels[e.edgeType]}</li>`).join('') : '<li>이 영역 안에 표시할 관계가 아직 등록되지 않았습니다.</li>';
      return heading('영역 확대 / 개념을 골라 펼치기',topic.title,`샘플 ${concepts.length}개 · 영역 밖 연결은 개념의 의존성 패널에서 확인`) + `<div class="ma-stage"><div class="ma-constellation" data-region="constellation" aria-label="${escape(topic.title)} 개념 배치"><svg class="ma-map-svg" aria-hidden="true" data-region="edges"></svg>${nodes}</div><div class="ma-group-footer"><span>→ 필수 선행만 표시 · 교수학적 가설</span><span>학년 ${escape([...new Set(concepts.map(c=>c.stage))].join(', '))} · 배치 제안</span></div><details class="ma-group-edges"><summary class="cursor-interaction">현재 영역의 관계 ${edges.length}개를 글로 보기</summary><ul>${edgeList}</ul></details></div>`;
    }
    function relationHtml(edge, incoming){
      const other=byConcept.get(incoming?edge.fromId:edge.toId);
      return `<div class="ma-relation" data-edge="${edge.id}" data-edge-type="${edge.edgeType}"><span class="ma-relation-kind">${relationLabels[edge.edgeType]} · ${escape(byTopic.get(other.canonicalParentId).title)}</span>${action('concept',other.id,other.title)}<p>${escape(edge.justification)}</p></div>`;
    }
    function panelHtml(c){
      const incoming=visibleEdges().filter(e=>e.toId===c.id); const outgoing=visibleEdges().filter(e=>e.fromId===c.id);
      const gaps=data.gaps.filter(g=>g.id!=='curriculum-mapping' && g.conceptIds.includes(c.id));
      return `<aside class="ma-panel" aria-label="${escape(c.title)} 의존성"><h3>의존성</h3><p class="ma-panel-note">선택: ${escape(c.title)}<br>관계는 교수학적 가설입니다.</p><fieldset class="ma-filters"><legend>표시할 관계</legend><label class="ma-filter"><input type="checkbox" checked disabled>필수 선행</label>${config.dependencies.optional.map(t=>`<label class="ma-filter cursor-interaction"><input type="checkbox" data-edge-toggle="${t}" ${state.visibleEdges.has(t)?'checked':''}>${relationLabels[t]}</label>`).join('')}</fieldset><h3 class="ma-relation-heading">이 개념으로 들어오는 관계</h3>${incoming.map(e=>relationHtml(e,true)).join('')||'<p class="ma-no-relation">표시 중인 관계가 없습니다. 선수가 필요 없다는 뜻은 아닙니다.</p>'}<h3 class="ma-relation-heading">이 개념에서 이어지는 관계</h3>${outgoing.map(e=>relationHtml(e,false)).join('')||'<p class="ma-no-relation">표시 중인 연결이 아직 없습니다.</p>'}${gaps.length?`<div class="ma-gap">선수 연결 미완성${gaps.map(g=>`<strong>${escape(g.title)}</strong><p>${escape(g.description)}</p>`).join('')}</div>`:''}</aside>`;
    }
    function conceptHtml(){
      const c=byConcept.get(state.conceptId); const topic=byTopic.get(c.canonicalParentId);
      const terms=c.terms.map(t=>`<details class="ma-atom" open data-atom-id="${t.id}"><summary class="cursor-interaction"><span>${escape(t.label)}</span></summary><p>${escape(t.meaning)}</p><small>${escape(t.id)}</small></details>`).join('');
      const symbols=c.symbols.map(s=>`<details class="ma-atom" open data-atom-id="${s.id}"><summary class="cursor-interaction"><span>${escape(s.notation)}</span></summary><p>${escape(s.meaning)}</p><p>${escape(s.scope)}</p><small>${escape(s.id)}</small></details>`).join('');
      const lens=c.advancedLens?`<details class="ma-advanced"><summary class="cursor-interaction">대학 관점으로 읽기<span class="ma-lens-label">별도의 설명 렌즈 · 교육과정 선수 아님</span></summary><p>${escape(c.advancedLens.statement)}</p><p>${escape(c.advancedLens.proof)}</p></details>`:'';
      return heading('개념 펼치기 / 의미 · 원자 요소 · 의존성',c.title,`${topic.title} · ${c.stage} 배치 제안 · ${c.id}`)+`<div class="ma-concept-layout"><article class="ma-concept-main"><p class="ma-meaning">${escape(c.meaning)}</p><div class="ma-detail-label">적용 조건</div><ul class="ma-condition-list">${c.conditions.map(x=>`<li>${escape(x)}</li>`).join('')}</ul><div class="ma-detail-label">예시</div><div class="ma-example">${escape(c.example)}</div><p class="ma-misconception">주의 · ${escape(c.misconception)}</p><div class="ma-atoms"><section aria-label="용어"><h3>용어 ${c.terms.length}</h3>${terms}</section><section aria-label="기호"><h3>기호 ${c.symbols.length}</h3>${symbols}</section></div>${lens}</article>${panelHtml(c)}</div><div class="ma-context-strip" aria-label="같은 영역의 개념"><span>${escape(topic.title)}</span>${conceptsIn(topic.id).map(x=>action('concept',x.id,x.title,`aria-pressed="${x.id===c.id}"`)).join('')}</div>`;
    }
    function drawEdges(){
      const svg=root.querySelector('[data-region="edges"]'); const canvas=root.querySelector('[data-region="constellation"]');
      if(!svg || !canvas || state.level!=='group') return;
      const bounds=canvas.getBoundingClientRect(); if(!bounds.width || !bounds.height) return;
      svg.setAttribute('viewBox',`0 0 ${bounds.width} ${bounds.height}`);
      const nodes=new Map(Array.from(canvas.querySelectorAll('[data-node]')).map(n=>[n.dataset.node,n]));
      const lines=data.dependencyEdges.filter(e=>e.edgeType==='required_prerequisite'&&nodes.has(e.fromId)&&nodes.has(e.toId)).map(e=>{
        const a=nodes.get(e.fromId).getBoundingClientRect(); const b=nodes.get(e.toId).getBoundingClientRect();
        const ax=a.left-bounds.left+a.width/2, ay=a.top-bounds.top+a.height/2, bx=b.left-bounds.left+b.width/2, by=b.top-bounds.top+b.height/2;
        const dx=bx-ax,dy=by-ay; const fa=Math.min(dx? a.width/2/Math.abs(dx):Infinity,dy? a.height/2/Math.abs(dy):Infinity); const fb=Math.min(dx? b.width/2/Math.abs(dx):Infinity,dy? b.height/2/Math.abs(dy):Infinity);
        return `<path class="ma-edge" d="M ${ax+dx*fa} ${ay+dy*fa} L ${bx-dx*fb} ${by-dy*fb}" marker-end="url(#ma-arrow)"/>`;
      }).join('');
      svg.innerHTML=`<defs><marker id="ma-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="currentColor" stroke-width="1.25"/></marker></defs>${lines}`;
    }
    function render(){
      let crumb=state.level==='overview'?'<span aria-current="page">전체 지도</span>':action('home','','전체 지도');
      if(state.topicId){const topic=byTopic.get(state.topicId);crumb+=`<span aria-hidden="true">›</span>${state.level==='group'?`<span aria-current="page">${escape(topic.title)}</span>`:action('topic',topic.id,topic.title)}`;}
      if(state.conceptId) crumb+=`<span aria-hidden="true">›</span><span aria-current="page">${escape(byConcept.get(state.conceptId).title)}</span>`;
      breadcrumb.innerHTML=crumb;
      root.querySelector('[data-action="back"]').disabled=state.level==='overview';
      content.innerHTML=state.level==='overview'?overviewHtml():state.level==='group'?groupHtml():conceptHtml();
      announcement.textContent=state.level==='overview'?'전체 지도. 다섯 영역, 12개 샘플 개념.':state.level==='group'?`${byTopic.get(state.topicId).title} 영역 확대.`:`${byConcept.get(state.conceptId).title} 개념과 의존성 표시.`;
      root.dataset.level=state.level;
      requestAnimationFrame(drawEdges);
    }
    function navigate(actionName,id){
      if(actionName==='home'){state.level='overview';state.topicId=null;state.conceptId=null;}
      else if(actionName==='topic'&&byTopic.has(id)){state.level='group';state.topicId=id;state.conceptId=null;}
      else if(actionName==='concept'&&byConcept.has(id)){state.level='concept';state.conceptId=id;state.topicId=byConcept.get(id).canonicalParentId;}
      else if(actionName==='back'){
        if(state.level==='concept'){state.level='group';state.conceptId=null;}
        else {state.level='overview';state.topicId=null;state.conceptId=null;}
      } else return;
      render();
      const focusTarget=state.level==='group'?content.querySelector('[data-action="concept"]'):state.level==='overview'?content.querySelector('[data-action="topic"]'):root.querySelector('[data-action="back"]');
      if(focusTarget)focusTarget.focus({preventScroll:true});
    }
    root.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(button&&root.contains(button))navigate(button.dataset.action,button.dataset.id);});
    root.addEventListener('change',event=>{const type=event.target.dataset.edgeToggle;if(!config.dependencies.optional.includes(type))return;if(event.target.checked)state.visibleEdges.add(type);else state.visibleEdges.delete(type);render();const checkbox=root.querySelector(`[data-edge-toggle="${type}"]`);if(checkbox)checkbox.focus({preventScroll:true});});
    if(typeof ResizeObserver==='function')new ResizeObserver(drawEdges).observe(content);
    /* TEST_HOOK */
    render();
  })();
  </script>
