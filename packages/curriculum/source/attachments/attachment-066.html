s"},{"kind":"dependency_edge","id":"edge-3","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"fraction-notation","toId":"equivalent-fractions","edgeType":"required_prerequisite","justification":"분수의 값과 단위 의미를 사용한다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-4","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"common-multiple","toId":"common-denominator","edgeType":"required_prerequisite","justification":"공통 분모를 공배수로 고른다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-5","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"equivalent-fractions","toId":"common-denominator","edgeType":"required_prerequisite","justification":"값을 보존하며 분모를 바꾼다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-6","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"common-denominator","toId":"fraction-add","edgeType":"required_prerequisite","justification":"분모가 다른 분수를 같은 단위로 맞춘다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-7","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"rational","toId":"rational-add","edgeType":"required_prerequisite","justification":"양수와 음수를 포함하는 유리수를 다룬다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-8","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"common-denominator","toId":"rational-add","edgeType":"required_prerequisite","justification":"분수로 표시한 유리수의 단위를 맞춘다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-9","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"lcm","toId":"common-denominator","edgeType":"helpful_prerequisite","justification":"가장 작은 공통 분모를 선택하는 효율화 관계이며 필수 선수로 단정하지 않는다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-10","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"fraction-notation","toId":"rational","edgeType":"representation","justification":"분수 표기가 유리수를 나타내는 표현으로 확장된다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-11","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"fraction-add","toId":"rational-add","edgeType":"related","justification":"양의 분수 덧셈과 부호 있는 수의 덧셈을 연결한다.","evidenceStatus":"pedagogical_hypothesis"},{"kind":"dependency_edge","id":"edge-12","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"fromId":"exponents","toId":"square-roots","edgeType":"related","justification":"제곱 연산과 역방향 관계를 연결하되 전체 지수법칙을 필수 선수로 단정하지 않는다.","evidenceStatus":"pedagogical_hypothesis"}],"gaps":[{"kind":"qa_gap","id":"curriculum-mapping","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":null,"title":"교육과정 대응 미확정","description":"별책 8의 성취기준 원문과 개념별 대응을 아직 확정하지 않았다. 학년 표시는 UI 배치 제안이다.","conceptIds":["multiple","common-multiple","lcm","fraction-notation","equivalent-fractions","common-denominator","fraction-add","fraction-divide","rational","rat <script type="application/json" id="atlas-config">{"kind":"ui_information_architecture","id":"matheducation-overview-grid","schemaVersion":"1.0.0","revision":1,"status":"prototype","sourceSnapshot":{"kind":"source_snapshot","reference":"library-file:fde1_bGliZmlsZV96RXA2TlY5dElCalFjZUZIN3pvZlZn_FileDrive_73e3d24e44d881918a9b9622fd5a4193","revision":2,"sha256":"3332d52420632f5a5afc872692f9a9bfcd81d238705d8d63918c0c9a70118308"},"displayDomains":[{"kind":"display_domain","id":"numbers","label":"수의 관계와 계산","sourceTopicIds":["natural","fractions","rational-domain","real-domain"],"coverage":"sample_only"},{"kind":"display_domain","id":"expressions","label":"식과 구조","sourceTopicIds":["algebra"],"coverage":"sample_only"},{"kind":"display_domain","id":"space","label":"공간과 도형","sourceTopicIds":[],"coverage":"empty_scaffold"},{"kind":"display_domain","id":"uncertainty","label":"자료와 불확실성","sourceTopicIds":[],"coverage":"empty_scaffold"}],"gradeBands":[{"kind":"display_grade_band","id":"초5–6","label":"초5–6","mappingStatus":"proposed_unverified"},{"kind":"display_grade_band","id":"중1","label":"중1","mappingStatus":"proposed_unverified"},{"kind":"display_grade_band","id":"중2","label":"중2","mappingStatus":"proposed_unverified"},{"kind":"display_grade_band","id":"중3","label":"중3","mappingStatus":"proposed_unverified"}],"drilldownLevels":["overview","domain_grade","topic","concept","term_or_symbol"],"contract":{"canonicalDataModified":false,"ontologyModified":false,"textbookUnitsAsserted":false,"curriculumCoverageClaimed":false,"elementaryGradeSplitKnown":false,"allConceptIdsPreserved":true,"defaultEdgeTypes":["required_prerequisite"],"automaticSourceSync":false,"statePersistence":"local_only"}}</script>
<script>
(()=>{
const root=document.getElementById('math-atlas-grid');
const data=JSON.parse(root.querySelector('#atlas-canonical').textContent);
const config=JSON.parse(root.querySelector('#atlas-config').textContent);
const body=root.querySelector('.a-body'),crumbs=root.querySelector('.a-crumbs');
const concepts=new Map(data.concepts.map(c=>[c.id,c])),groups=new Map(data.groups.map(g=>[g.id,g]));
const domains=new Map(config.displayDomains.map(d=>[d.id,d]));
const state={level:0,domain:null,stage:null,group:null,concept:null,atom:null};
const visible={helpful_prerequisite:false,representation:false,related:false};
const names={required_prerequisite:'필수 선행',helpful_prerequisite:'도움되는 선행',representation:'다른 표현',related:'관련 개념'};
const esc=x=>String(x).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
const list=(domain,stage)=>data.concepts.filter(c=>domains.get(domain).sourceTopicIds.includes(c.canonicalParentId)&&c.stage===stage);
function actionButton(action,label,extra='',cls=''){return `<button type="button" class="${cls} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;}
function heading(title,sub){return `<div class="a-head"><div><h2>${esc(title)}</h2><div class="a-small">${esc(sub)}</div></div>${state.level?actionButton('back','← 한 단계 위','','a-back'):''}</div>`;}
function breadcrumbs(){const parts=[{label:'전체 범위',level:0}];if(state.level>=1)parts.push({label:domains.get(state.domain).label+' · '+state.stage,level:1});if(state.level>=2)parts.push({label:groups.get(state.group).title,level:2});if(state.level>=3)parts.push({label:concepts.get(state.concept).title,level:3});if(state.level>=4){const c=concepts.get(state.concept),a=c.terms.concat(c.symbols).find(a=>a.id===state.atom);parts.push({label:a.label||a.notation,level:4});}crumbs.innerHTML=parts.map((p,i)=>(i?'<span aria-hidden="true">›</span>':'')+actionButton('level',esc(p.label),`data-level="${p.level}"`,p.level===state.level?'a-current':'')).join('');}
function overview(){return heading('무엇이 어디에 있는가','표시 영역 × 학년 배치 → 학습 묶음 → 개념 → 용어와 기호')+`<div class="a-warning">초5와 초6은 원본에서 묶여 있습니다. 아래 위치는 샘플 배치이며 공식 학년·단원 대응이 아닙니다.</div><table aria-label="표시 영역과 제안 학년별 개념 범위"><thead><tr><th scope="col">표시 영역</th>${config.gradeBands.map(g=>`<th scope="col">${esc(g.label)}<br><span class="a-cell-sub">배치 미확정</span></th>`).join('')}</tr></thead><tbody>${config.displayDomains.map(d=>`<tr><th scope="row">${esc(d.label)}<br><span class="a-cell-sub">${d.coverage==='empty_scaffold'?'미구축 영역':'편집용 표시 영역'}</span></th>${config.gradeBands.map(g=>{const cs=list(d.id,g.id);const units=[...new Set(cs.map(c=>c.canonicalParentId))];return `<td>${actionButton('cell',`<span class="a-mobile-stage">${esc(g.label)}</span><span class="a-count">${cs.length?cs.length+'개':'미구축'}</span><span class="a-cell-sub">${cs.length?units.length+'개 학습 묶음 · 열기 →':'표본 없음 · 범위 확인'}</span>`,`data-domain="${d.id}" data-stage="${g.id}"`,'a-cell'+(!cs.length?' a-cell-empty':''))}</td>`;}).join('')}</tr>`).join('')}</tbody></table><div class="a-note">숫자는 저장된 표본 개념 수입니다. 0개인 칸도 실제 교육과정에 내용이 없다는 뜻은 아닙니다.</div>`;}
function units(){const cs=list(state.domain,state.stage),gs=[...new Set(cs.map(c=>c.canonicalParentId))];return heading(domains.get(state.domain).label+' · '+state.stage,'학습 묶음 선택 · 교과서 목차와 독립된 화면 분류')+(gs.length?`<div class="a-items">${gs.map(id=>{const items=cs.filter(c=>c.canonicalParentId===id);return actionButton('group',`<span class="a-item-label">학습 묶음 · ${items.length}개 개념</span><strong>${esc(groups.get(id).title)}</strong><span class="a-small">${items.map(c=>esc(c.title)).join(' · ')}</span><span class="a-item-label">개념 목록 열기 →</span>`,`data-id="${id}"`,'a-item');}).join('')}</div>`:`<div class="a-empty"><h3>아직 표본을 넣지 않은 영역</h3><p>이 칸의 교육과정 내용과 개념 목록은 확정하지 않았습니다.</p><div class="a-small">빈 영역을 그대로 남겨, 구축된 지식과 앞으로 채울 범위를 구분합니다.</div></div>`);}
function unit(){const cs=list(state.domain,state.stage).filter(c=>c.canonicalParentId===state.group);return heading(groups.get(state.group).title,cs.length+'개 개념 · 순서는 학습 의존성을 의미하지 않음')+`<div class="a-items">${cs.map(c=>actionButton('concept',`<span class="a-item-label">concept · ${c.terms.length}개 용어 / ${c.symbols.length}개 기호</span><strong>${esc(c.title)}</strong><span class="a-small">${esc(c.meaning)}</span><span class="a-item-label">개념과 의미 보기 →</span>`,`data-id="${c.id}"`,'a-item')).join('')}</div>`;}
function side(c){const es=data.dependencyEdges.filter(e=>(e.toId===c.id||e.fromId===c.id)&&(e.edgeType==='required_prerequisite'||visible[e.edgeType]));return `<aside class="a-side"><h3>이 개념의 연결</h3><div class="a-small">선행 → 후속 · 교수 관점의 가설</div>${es.length?es.map(e=>{const other=e.toId===c.id?e.fromId:e.toId;return actionButton('jump',`<span class="a-chip">${esc(names[e.edgeType])}</span><br>${esc(concepts.get(e.fromId).title)} → ${esc(concepts.get(e.toId).title)}`,`data-id="${other}"`,'a-link');}).join(''):'<p class="a-small">선택된 관계에 연결 없음. 선수 지식이 없다는 뜻은 아닙니다.</p>'}<div class="a-toggles">${Object.keys(visible).map(k=>`<label><input type="checkbox" data-edge="${k}" ${visible[k]?'checked':''}>${esc(names[k])}</label>`).join('')}</div><div class="a-small">분류 경로와 관계 그래프는 별개입니다.</div></aside>`;}
function detail(){const c=concepts.get(state.concept);return heading(c.title,'개념의 내용에서 용어와 기호의 의미로 들어가기')+`<div class="a-layout"><div class="a-detail"><span class="a-chip">${esc(c.id)}</span><span class="a-chip">${esc(c.stage)} 배치 제안</span><p>${esc(c.meaning)}</p><h3>용어 ${c.terms.length}</h3><div class="a-atom-grid">${c.terms.map(a=>actionButton('atom',`<span>${esc(a.label)}</span><span class="a-small">용어의 의미 →</span>`,`data-id="${a.id}"`,'a-atom')).join('')}</div><h3>기호 ${c.symbols.length}</h3><div class="a-atom-grid">${c.symbols.map(a=>actionButton('atom',`<span class="a-code">${esc(a.notation)}</span><span class="a-small">기호의 의미와 범위 →</span>`,`data-id="${a.id}"`,'a-atom')).join('')}</div><h3>적용 조건</h3><ul>${c.conditions.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><h3>예시</h3><div class="a-example">${esc(c.example)}</div><p class="a-small">주의 · ${esc(c.misconception)}</p>${c.advancedLens?`<details><summary>대학 수준 해설</summary><p>${esc(c.advancedLens.statement)}</p><p>${esc(c.advancedLens.proof)}</p><div class="a-small">설명 관점이며 학생의 필수 선행 요건에 포함하지 않습니다.</div></details>`:''}</div>${side(c)}</div>`;}
function atom(){const c=concepts.get(state.concept),a=c.terms.concat(c.symbols).find(a=>a.id===state.atom);return heading(a.kind==='term'?'용어의 의미':'기호의 의미',c.title+' 안에서 해석하는 의미 단위')+`<div class="a-layout"><div class="a-detail"><span class="a-chip">${a.kind==='term'?'term':'symbol'}</span><span class="a-chip">${esc(a.id)}</span><div class="a-atom-title ${a.kind==='symbol'?'a-code':''}">${esc(a.label||a.notation)}</div><div class="a-atom-meaning">${esc(a.meaning)}</div>${a.scope?`<h3>이 표기의 해석 범위</h3><div class="a-example">${esc(a.scope)}</div>`:''}<h3>상위 개념의 예시</h3><div class="a-example">${esc(c.example)}</div><div class="a-rule a-small">원자 항목도 상위 개념과 해석 맥락을 유지합니다.</div></div>${side(c)}</div>`;}
function render(){breadcrumbs();body.innerHTML=[overview,units,unit,detail,atom][state.level]();}
function focusCurrent(){const selectors=['[data-action="cell"]','[data-action="group"]','[data-action="concept"]','[data-action="atom"]','[data-action="back"]'];const target=body.querySelector(selectors[state.level])||body.querySelector('[data-action="back"]');if(target)target.focus({preventScroll:true});}
function jump(id){const c=concepts.get(id);state.domain=config.displayDomains.find(d=>d.sourceTopicIds.includes(c.canonicalParentId)).id;state.stage=c.stage;state.group=c.canonicalParentId;state.concept=id;state.atom=null;state.level=3;}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const d=b.dataset;if(d.action==='level')state.level=Number(d.level);if(d.action==='back')state.level=Math.max(0,state.level-1);if(d.action==='cell'){Object.assign(state,{level:1,domain:d.domain,stage:d.stage,group:null,concept:null,atom:null});}if(d.action==='group'){state.group=d.id;state.level=2;}if(d.action==='concept'||d.action==='jump')jump(d.id);if(d.action==='atom'){state.atom=d.id;state.level=4;}render();focusCurrent();});
root.addEventListener('change',e=>{if(e.target.dataset.edge){const key=e.target.dataset.edge;visible[key]=e.target.checked;render();const target=body.querySelector('[data-edge="'+key+'"]');if(target)target.focus({preventScroll:true});}});
render();
})();
</script>
</div>
