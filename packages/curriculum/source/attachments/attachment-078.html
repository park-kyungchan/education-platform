2","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"equivalent-fractions","label":"확장","meaning":"분자와 분모에 같은 양의 정수를 곱해 동치분수를 만듦"}],"symbols":[{"kind":"symbol","id":"equivalent-fractions.symbol.1","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"equivalent-fractions","notation":"=","meaning":"왼쪽과 오른쪽이 같은 수를 나타냄","scope":"계산 순서 표시가 아님"},{"kind":"symbol","id":"equivalent-fractions.symbol.2","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"equivalent-fractions","notation":"a/b = (a × k)/(b × k)","meaning":"분자와 분모를 같은 비율로 바꿈","scope":"b ≠ 0, k ≠ 0"}],"conditions":["초등 확장에서는 k를 양의 자연수로 둔다.","약분할 때는 분자와 분모를 같은 0이 아닌 공약수로 나눈다."],"example":"1/2 = 2/4 = 3/6","misconception":"분자와 분모에 같은 수를 더하면 일반적으로 값이 달라진다.","evidenceStatus":"author_constructed_math_example","achievementStandardIds":[],"advancedLens":{"kind":"advanced_explanation","audience":"university","notCurricularPrerequisite":true,"statement":"정수쌍 (a,b), b ≠ 0에 대해 (a,b) ~ (c,d)를 ad=bc로 정의한다.","proof":"반사성과 대칭성은 등식의 성질에서 따른다. ad=bc, cf=de이면 adf=bcf=bde이므로 d(af−be)=0이다. d ≠ 0이고 정수에는 영인자가 없으므로 af=be이다. 따라서 추이성이 성립한다. 동치분수는 이 동치관계가 정하는 같은 동치류의 서로 다른 대표원이다."}},{"kind":"concept","id":"common-denominator","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"fractions","title":"통분","stage":"초5–6","stageMappingStatus":"proposed_not_standard_mapped","meaning":"분모가 다른 분수들을 값이 같은 분수로 바꾸어 분모를 같게 하는 과정이다.","terms":[{"kind":"term","id":"common-denominator.term.1","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"common-denominator","label":"통분","meaning":"공통 분모를 갖는 동치분수로 바꾸는 과정"},{"kind":"term","id":"common-denominator.term.2","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"common-denominator","label":"공통 분모","meaning":"각 분모의 양의 공배수"}],"symbols":[{"kind":"symbol","id":"common-denominator.symbol.1","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"common-denominator","notation":"L/b","meaning":"분모 b를 공통 분모 L로 바꾸는 배수","scope":"L은 b의 양의 배수"}],"conditions":["분모들은 양의 정수이다.","최소공배수는 효율적인 선택이지만 통분의 필수 조건은 아니다."],"example":"1/4 = 3/12, 1/6 = 2/12. 24로 통분해도 된다.","misconception":"분자가 0이 아닌 분수에서 분모만 바꾸고 분자를 그대로 두면 값이 바뀐다.","evidenceStatus":"author_constructed_math_example","achievementStandardIds":[],"advancedLens":{"kind":"advanced_explanation","audience":"university","notCurricularPrerequisite":true,"statement":"통분은 유리수의 동치류에서 분모를 일치시키는 대표원 선택이다.","proof":"b,d가 양의 정수이고 L이 두 수의 공배수이면 u=L/b, v=L/d는 정수이다. (a,b)와 (au,L)는 aL=b(au)를 만족하므로 같은 유리수를 나타낸다. 따라서 a/b + c/d = (au+cv)/L이다. L이 최소일 필요는 없으며, 최소공배수 선택은 정규화가 아니라 계산 크기를 줄이는 선택이다."}},{"kind":"concept","id":"fraction-add","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"fractions","title":"분수 덧셈","stage":"초5–6","stageMappingStatus":"proposed_not_standard_mapped","meaning":"같은 단위로 맞춘 뒤 단위의 개수를 더한다.","terms":[{"kind":"term","id":"fraction-add.term.1","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"fraction-add","label":"공통 단위","meaning":"통분 뒤 두 분수가 함께 사용하는 단위분수"}],"symbols":[{"kind":"symbol","id":"fraction-add.symbol.1","schemaVersion":"1.1.0","revision":2,"status":"prototype","sourceIds":["src-author"],"updatedAt":"2026-10-06T06:05:00Z","canonicalParentId":"fraction-add","notation":"a/L + b/L","meaning":"같은 단위 1/L의 개수를 합침","scope":"L은 양의 정수"}],"conditio function inspector(c){let body='';if(state.tab==='concept'){body=`<p>${esc(c.meaning)}</p><h3>조건</h3><ul>${c.conditions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>예시</h3><div class="me-example">${renderExample(c)}</div><p class="me-caption">주의 · ${esc(c.misconception)}</p><h3>용어와 기호</h3>${c.terms.concat(c.symbols).map(a=>`<details class="me-atom" ${a.id===state.atomId?'open':''}><summary>${renderAtom(a,{mode:'inline'})}</summary>${a.kind==='symbol'?renderAtom(a,{mode:'display'}):''}<p>${esc(a.meaning)}</p>${a.scope?`<p class="me-caption">${esc(a.scope)}</p>`:''}<small>${esc(a.id)}</small></details>`).join('')}${c.advancedLens?`<details class="me-atom"><summary>대학 수준 해설</summary><p>${esc(c.advancedLens.statement)}</p><p>${esc(c.advancedLens.proof)}</p><small>교육과정 선수 요건과 분리한 설명 관점</small></details>`:''}`;}else if(state.tab==='relations'){const es=relevantEdges(c.id);body=`<p class="me-caption">방향: 선행 → 후속. 다른 표현·관련 개념은 연관 표시입니다.</p>${es.map(e=>{const other=concepts.get(e.fromId===c.id?e.toId:e.fromId);return `<div class="me-rel"><div class="me-caption">${esc(relations.get(e.edgeType).label)} · ${e.toId===c.id?'이 개념으로 들어옴':'이 개념에서 이어짐'}</div>${btn('concept',other.id,esc(other.title))}<p>${esc(e.justification)}</p></div>`;}).join('')||'<div class="me-empty">표시 중인 관계 없음. 필요한 선수 지식이 없다는 뜻은 아닙니다.</div>'}`;}else{const gaps=source.gaps.filter(g=>!g.conceptIds.length||g.conceptIds.includes(c.id));body=`<p class="me-caption">${esc(c.id)} · ${bandLabel(c.bandId)} 표본 배치</p>${gaps.map(g=>`<div class="me-gap"><strong>${esc(g.title)}</strong><p>${esc(g.description)}</p></div>`).join('')}<p class="me-caption">관계 채택·수정은 별도 변경 제안 계약의 대상입니다. 이 화면은 읽기와 탐색만 수행합니다.</p>`;}return `<aside class="me-inspector" aria-label="선택한 개념 상세"><div class="me-inspector-head"><div><strong>${esc(c.title)}</strong><div class="me-caption">${esc(c.id)}</div></div>${btn('clear','','닫기','me-close')}</div><div class="me-tabs" aria-label="개념 상세 보기">${[['concept','개념'],['relations','관계'],['review','검토']].map(([id,label])=>btn('inspect-tab',id,label,'',`aria-pressed="${state.tab===id}"`)).join('')}</div><div class="me-inspector-body">${body}</div></aside>`;}
function draw(){const canvas=root.querySelector('.me-canvas'),svg=root.querySelector('.me-edge-svg');if(!canvas||!svg)return;const box=canvas.getBoundingClientRect();if(!box.width||!box.height)return;svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);const nodes=new Map([...canvas.querySelectorAll('[data-node]')].map(n=>[n.dataset.node,n]));const paths=source.dependencyEdges.filter(e=>state.visibleRelations.has(e.edgeType)&&nodes.has(e.fromId)&&nodes.has(e.toId)).map(e=>{const a=nodes.get(e.fromId).getBoundingClientRect(),b=nodes.get(e.toId).getBoundingClientRect();const ax=a.left-box.left+a.width/2,ay=a.top-box.top+a.height/2,bx=b.left-box.left+b.width/2,by=b.top-box.top+b.height/2,dx=bx-ax,dy=by-ay;if(!dx&&!dy)return '';const ra=Math.min(dx?a.width/2/Math.abs(dx):Infinity,dy?a.height/2/Math.abs(dy):Infinity),rb=Math.min(dx?b.width/2/Math.abs(dx):Infinity,dy?b.height/2/Math.abs(dy):Infinity);const x1=ax+dx*ra,y1=ay+dy*ra,x2=bx-dx*rb,y2=by-dy*rb,mid=(y1+y2)/2;const r=relations.get(e.edgeType);return `<path class="me-edge ${(state.conceptId===e.fromId||state.conceptId===e.toId)?'me-highlight':''}" data-style="${r.lineStyle}" d="M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}" ${r.directedVisual?'marker-end="url(#me-arrow-r3)"':''}/>`;}).join('');svg.innerHTML='<defs><marker id="me-arrow-r3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L6,3.5 L1,6" fill="none" stroke="currentColor" stroke-width="1.3"/></marker></defs>'+paths;}
function render(){headingPath();view.innerHTML=!state.domainId?overview():!state.topicId?domainView():graph();live.textContent=state.conceptId?concepts.get(state.conceptId).title+' 선택':state.topicId?topics.get(state.topicId).title+' 개념 지도':state.domainId?domains.get(state.domainId).label+' 영역':'전체 지도';requestAnimationFrame(draw);}
function searchHits(){const q=state.query.trim().normalize('NFKC').toLowerCase();if(!q)return [];const hits=[];for(const c of concepts.values()){if(!inBand(c))continue;const fields=[{value:c.title,kind:'개념',atomId:null},...c.terms.map(a=>({value:a.label,kind:'용어',atomId:a.id})),...c.symbols.map(a=>({value:a.notation,kind:'기호',atomId:a.id}))];let hit=null;for(const f of fields){const text=f.value.normalize('NFKC').toLowerCase();const score=text===q?3:text.startsWith(q)?2:text.includes(q)?1:0;if(score&&(!hit||score>hit.score))hit={conceptId:c.id,conceptTitle:c.title,match:f.value,kind:f.kind,atomId:f.atomId,score};}if(hit)hits.push(hit);}return hits.sort((a,b)=>b.score-a.score||a.conceptTitle.localeCompare(b.conceptTitle,'ko')).slice(0,config.interaction.searchResultLimit);}
function renderSearch(){const hits=searchHits();state.searchIndex=Math.max(0,Math.min(state.searchIndex,hits.length-1));results.innerHTML=!state.query.trim()?'':hits.length?hits.map((h,i)=>btn('search-result',h.conceptId,`<span><strong>${esc(h.conceptTitle)}</strong><br><span class="me-result-match">${esc(h.kind+' · '+h.match)}</span></span><span class="me-result-match">${esc(topics.get(concepts.get(h.conceptId).canonicalParentId).title)} →</span>`,'me-search-result',`data-hit="${i}" aria-pressed="${i===state.searchIndex}"`)).join(''):'<p class="me-empty">검색 결과가 없습니다.</p>';search.setAttribute('aria-expanded',String(Boolean(state.query.trim())));live.textContent=state.query.trim()?hits.length+'개 검색 결과'+(hits.length?', '+hits[state.searchIndex].conceptTitle+' 선택':''):'';}
function clearSearch(){state.query='';state.searchIndex=0;search.value='';renderSearch();}
function selectConcept(id,atom=null){if(!concepts.has(id))return;const c=concepts.get(id);if(!inBand(c)){state.bandId='all';band.value='all';}state.conceptId=id;state.topicId=c.canonicalParentId;state.domainId=domainOfTopic(c.canonicalParentId).id;state.atomId=atom;state.tab='concept';state.page=0;}
function navigate(action,id,hitIndex){if(!allowedActions.has(action))return;if(action==='home'){state.domainId=null;state.topicId=null;state.conceptId=null;}else if(action==='back'){if(state.conceptId)state.conceptId=null;else if(state.topicId)state.topicId=null;else state.domainId=null;}else if(action==='domain'&&domains.has(id)){state.domainId=id;state.topicId=null;state.conceptId=null;}else if(action==='topic'&&topics.has(id)){state.topicId=id;state.domainId=domainOfTopic(id).id;state.conceptId=null;}else if(action==='concept')selectConcept(id);else if(action==='clear')state.conceptId=null;else if(action==='inspect-tab'&&['concept','relations','review'].includes(id))state.tab=id;else if(action==='search-result'){const hit=searchHits()[Number(hitIndex)];if(hit)selectConcept(hit.conceptId,hit.atomId);clearSearch();}else return;state.page=0;render();const focusTarget=state.conceptId?root.querySelector('[data-action="clear"]'):root.querySelector('[data-node]')||root.querySelector('[data-action="topic"]')||root.querySelector('[data-action="domain"]');if(focusTarget)focusTarget.focus({preventScroll:true});}
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||!root.contains(button))return;if(button.dataset.action)navigate(button.dataset.action,button.dataset.id,button.dataset.hit);else if(button.dataset.page!==undefined){state.page=Math.max(0,Number(button.dataset.page));state.conceptId=null;render();}});
root.addEventListener('change',e=>{if(e.target===band){state.bandId=band.value;state.domainId=null;state.topicId=null;state.conceptId=null;state.page=0;clearSearch();render();}else if(e.target.dataset.relation&&relations.has(e.target.dataset.relation)){const id=e.target.dataset.relation;if(e.target.checked)state.visibleRelations.add(id);else state.visibleRelations.delete(id);render();const target=root.querySelector('[data-relation="'+id+'"]');if(target)target.focus({preventScroll:true});}});
search.addEventListener('input',()=>{state.query=search.value;state.searchIndex=0;renderSearch();});
root.addEventListener('keydown',e=>{if(e.target===search){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=searchHits().length;if(n)state.searchIndex=(state.searchIndex+(e.key==='ArrowDown'?1:-1)+n)%n;renderSearch();}else if(e.key==='Enter'&&searchHits().length){e.preventDefault();navigate('search-result',null,state.searchIndex);}else if(e.key==='Escape'){e.preventDefault();clearSearch();search.blur();}return;}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();search.focus();}else if(e.key==='Escape'){e.preventDefault();if(state.query)clearSearch();else navigate('back');}else if(e.target.dataset?.node&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const nodes=[...root.querySelectorAll('[data-node]')],i=nodes.indexOf(e.target),delta=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;nodes[(i+delta+nodes.length)%nodes.length]?.focus();}});
if(typeof ResizeObserver==='function')new ResizeObserver(draw).observe(view);
/* TEST_HOOK */
render();
})();

</script>
</div>
