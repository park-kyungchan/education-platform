<script>
(()=>{
'use strict';
const root=document.getElementById('math-explorer-r2');if(!root)return;
const freeze=v=>{if(v&&typeof v==='object'){Object.values(v).forEach(freeze);Object.freeze(v);}return v;};
const source=freeze(JSON.parse(root.querySelector('#math-source-r2').textContent));
const config=freeze(JSON.parse(root.querySelector('#math-view-r2').textContent));
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const concepts=new Map(source.concepts.map(c=>[c.id,{...c,canonicalParentId:c.viewParentId||c.canonicalParentId,bandIds:Array.isArray(c.officialBandIds)?c.officialBandIds:[c.stage==='초5–6'?'e5_6':'m1_3'],bandId:Array.isArray(c.officialBandIds)?(c.officialBandIds[0]||'unknown'):(c.stage==='초5–6'?'e5_6':'m1_3')}]));
const topics=new Map(source.groups.filter(g=>g.kind==='topic').map(g=>[g.id,g]));
const domains=new Map(config.domains.map(d=>[d.id,d]));
const relations=new Map(config.relationRegistry.filter(t=>t.status!=='deprecated').map(t=>[t.id,t]));
for(const e of source.dependencyEdges)if(!relations.has(e.edgeType))relations.set(e.edgeType,{id:e.edgeType,label:'미등록 관계 '+e.edgeType,defaultVisible:false,layering:false,directedVisual:false,lineStyle:'dotted',status:'experimental'});
const allowedActions=new Set(config.actionRegistry.filter(a=>a.status==='active'&&a.sideEffect==='presentation_only').map(a=>a.handlerKey));
const state={domainId:null,topicId:null,conceptId:null,atomId:null,bandId:'all',page:0,tab:'concept',query:'',searchIndex:0,visibleRelations:new Set([...relations.values()].filter(t=>t.defaultVisible).map(t=>t.id))};
const view=root.querySelector('[data-role="view"]'),crumbs=root.querySelector('.me-crumbs'),live=root.querySelector('[data-role="live"]'),search=root.querySelector('#math-search-r2'),results=root.querySelector('#math-results-r2'),band=root.querySelector('#math-band-r2');
for(const [token,value] of Object.entries(config.theme.tokens))root.style.setProperty('--me-'+token,`light-dark(${value.light},${value.dark})`);
root.querySelector('[data-role="summary"]').textContent=`${concepts.size}개 표본 · ${domains.size}개 공식 영역`;
band.innerHTML='<option value="all">모든 학년군</option>'+config.bands.map(b=>`<option value="${b.id}">${esc(b.label)}</option>`).join('');
const inBand=c=>state.bandId==='all'||c.bandIds.includes(state.bandId);
const topicConcepts=id=>[...concepts.values()].filter(c=>c.canonicalParentId===id&&inBand(c));
const domainOfTopic=id=>config.domains.find(d=>d.sampleTopicIds.includes(id));
const domainConcepts=id=>[...concepts.values()].filter(c=>domains.get(id).sampleTopicIds.includes(c.canonicalParentId)&&inBand(c));
const bandLabel=id=>config.bands.find(b=>b.id===id)?.label||id;
const btn=(action,id,label,cls='',extra='')=>`<button type="button" class="${cls} cursor-interaction" data-action="${action}" data-id="${esc(id||'')}" ${extra}>${label}</button>`;
const titleline=(title,sub)=>`<div class="me-titleline"><div><h2>${esc(title)}</h2><p class="me-caption">${esc(sub)}</p></div></div>`;
function headingPath(){let html='';if(state.domainId)html+=btn('domain',state.domainId,esc(domains.get(state.domainId).label));if(state.topicId)html+='<span aria-hidden="true">›</span>'+btn('topic',state.topicId,esc(topics.get(state.topicId).title));if(state.conceptId)html+='<span aria-hidden="true">›</span><span aria-current="page">'+esc(concepts.get(state.conceptId).title)+'</span>';crumbs.innerHTML=html||'<span aria-current="page">전체 지도</span>';root.querySelector('[data-action="back"]').disabled=!state.domainId;}
function overview(){return titleline('전체 지형','공식 영역을 선택해 표본 개념으로 들어갑니다.')+`<div class="me-domain-map">${config.domains.map(d=>{const cs=domainConcepts(d.id);const ts=d.sampleTopicIds.map(id=>topics.get(id)).filter(t=>topicConcepts(t.id).length);return btn('domain',d.id,`<span class="me-domain-head"><span class="me-domain-name">${esc(d.label)}</span><span class="me-domain-count">${cs.length?cs.length+'개 표본':'표본 없음'}</span></span><span class="me-domain-topics">${ts.map(t=>`<span class="me-topic-pill">${esc(t.title)}</span>`).join('')||'<span class="me-caption">자료 연결 전 · 빈 영역도 범위에 포함</span>'}</span><span class="me-domain-open">${cs.length?'영역 확대 →':'영역 범위 확인 →'}</span>`,'me-domain'+(!cs.length?' me-empty-domain':''));}).join('')}</div><div class="me-coverage-note">영역명과 학년군은 공식 경계입니다. 아래 표본 개념의 영역 연결은 검토 중이며, 표본 수는 교육과정 전체 개념 수가 아닙니다.</div>`;}
function domainView(){const d=domains.get(state.domainId);const ts=d.sampleTopicIds.map(id=>topics.get(id)).filter(t=>topicConcepts(t.id).length);return titleline(d.label,'공식 영역 안의 설명용 개념 묶음 · 교과서 단원 구분과 별개')+(ts.length?`<div class="me-topics">${ts.map(t=>{const cs=topicConcepts(t.id);return btn('topic',t.id,`<span class="me-caption">${cs.length}개 표본 · ${[...new Set(cs.flatMap(c=>c.bandIds.map(bandLabel)))].join(' / ')}</span><strong>${esc(t.title)}</strong><span class="me-caption">${cs.slice(0,4).map(c=>esc(c.title)).join(' · ')}${cs.length>4?' 외 '+(cs.length-4)+'개':''}</span><span>개념 지도 열기 →</span>`,'me-topic-card');}).join('')}</div>`:'<div class="me-empty">이 학년군의 표본 개념을 아직 연결하지 않았습니다. 실제 교육과정에 내용이 없다는 뜻은 아닙니다.</div>');}
function ranks(nodes){const ids=new Set(nodes.map(c=>c.id)),edges=source.dependencyEdges.filter(e=>ids.has(e.fromId)&&ids.has(e.toId)&&relations.get(e.edgeType)?.layering);const incoming=new Map(nodes.map(c=>[c.id,0])),rank=new Map(nodes.map(c=>[c.id,0]));for(const e of edges)incoming.set(e.toId,incoming.get(e.toId)+1);const queue=nodes.filter(c=>incoming.get(c.id)===0).map(c=>c.id);let visited=0;while(queue.length){const id=queue.shift();visited++;for(const e of edges.filter(e=>e.fromId===id)){rank.set(e.toId,Math.max(rank.get(e.toId),rank.get(id)+1));incoming.set(e.toId,incoming.get(e.toId)-1);if(incoming.get(e.toId)===0)queue.push(e.toId);}}if(visited!==nodes.length)return {layers:[nodes],cycle:true};const levels=[...new Set(rank.values())].sort((a,b)=>a-b);return {layers:levels.map(n=>nodes.filter(c=>rank.get(c.id)===n)),cycle:false};}
function relevantEdges(id){return source.dependencyEdges.filter(e=>(e.fromId===id||e.toId===id)&&state.visibleRelations.has(e.edgeType));}
function graph(){const t=topics.get(state.topicId),all=topicConcepts(t.id);const size=config.renderer.groupNodePageSize;const pages=Math.max(1,Math.ceil(all.length/size));state.page=Math.min(state.page,pages-1);let nodes=all.slice(state.page*size,(state.page+1)*size);if(state.conceptId&&!nodes.some(c=>c.id===state.conceptId)){state.page=Math.floor(all.findIndex(c=>c.id===state.conceptId)/size);nodes=all.slice(state.page*size,(state.page+1)*size);}const rank=ranks(nodes);const neighbors=new Set(state.conceptId?relevantEdges(state.conceptId).flatMap(e=>[e.fromId,e.toId]):[]);const layout=`<div class="me-layout ${state.conceptId?'me-has-selection':''}"><section class="me-maparea" aria-label="개념 지도"><div class="me-canvas"><svg class="me-edge-svg" aria-hidden="true"></svg><div class="me-ranks">${rank.layers.map(layer=>`<div class="me-rank">${layer.map(c=>btn('concept',c.id,`<strong>${esc(c.title)}</strong><span>${c.terms.length} 용어 · ${c.symbols.length} 기호</span>`,'me-node'+(neighbors.has(c.id)?' me-neighbor':''),`data-node="${c.id}" aria-pressed="${state.conceptId===c.id}"`)).join('')}</div>`).join('')}</div></div><div class="me-mapbar"><span>${rank.cycle?'순환 관계 발견 · 계층 배치 보류':'필수 선행 가설을 기준으로 배치'}</span><span>${nodes.length}/${all.length}개 표시 · ${state.conceptId?'선택과 이웃 강조':'개념을 눌러 상세 보기'}</span></div>${pages>1?`<div class="me-pager"><button type="button" data-page="${state.page-1}" ${!state.page?'disabled':''}>이전</button><span>${state.page+1}/${pages}</span><button type="button" data-page="${state.page+1}" ${state.page===pages-1?'disabled':''}>다음</button></div>`:''}<fieldset class="me-edge-filters"><legend>관계 표시</legend>${[...relations.values()].map(r=>`<label><input type="checkbox" data-relation="${esc(r.id)}" ${state.visibleRelations.has(r.id)?'checked':''}>${esc(r.label)}${r.lineStyle==='dashed'?' ┄':r.lineStyle==='dotted'?' ···':r.lineStyle==='dashdot'?' ┄·':' ─'}</label>`).join('')}</fieldset><div class="me-mini-context" aria-label="전체 영역 맥락">${config.domains.map(d=>btn('domain',d.id,esc(d.label),'',`aria-current="${d.id===state.domainId}"`)).join('')}</div></section>${state.conceptId?inspector(concepts.get(state.conceptId)):''}</div>`;return titleline(t.title,domains.get(state.domainId).label+' / 설명용 묶음 · '+all.length+'개 표본')+layout;}
function inspector(c){let body='';if(state.tab==='concept'){body=`<p>${esc(c.meaning)}</p><h3>조건</h3><ul>${c.conditions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>예시</h3><div class="me-example">${esc(c.example)}</div><p class="me-caption">주의 · ${esc(c.misconception)}</p><h3>용어와 기호</h3>${c.terms.concat(c.symbols).map(a=>`<details class="me-atom" ${a.id===state.atomId?'open':''}><summary>${esc(a.label||a.notation)}</summary><p>${esc(a.meaning)}</p>${a.scope?`<p class="me-caption">${esc(a.scope)}</p>`:''}<small>${esc(a.id)}</small></details>`).join('')}${c.advancedLens?`<details class="me-atom"><summary>대학 수준 해설</summary><p>${esc(c.advancedLens.statement)}</p><p>${esc(c.advancedLens.proof)}</p><small>교육과정 선수 요건과 분리한 설명 관점</small></details>`:''}`;}else if(state.tab==='relations'){const es=relevantEdges(c.id);body=`<p class="me-caption">방향: 선행 → 후속. 다른 표현·관련 개념은 연관 표시입니다.</p>${es.map(e=>{const other=concepts.get(e.fromId===c.id?e.toId:e.fromId);return `<div class="me-rel"><div class="me-caption">${esc(relations.get(e.edgeType).label)} · ${e.toId===c.id?'이 개념으로 들어옴':'이 개념에서 이어짐'}</div>${btn('concept',other.id,esc(other.title))}<p>${esc(e.justification)}</p></div>`;}).join('')||'<div class="me-empty">표시 중인 관계 없음. 필요한 선수 지식이 없다는 뜻은 아닙니다.</div>'}`;}else{const gaps=source.gaps.filter(g=>!g.conceptIds.length||g.conceptIds.includes(c.id));body=`<p class="me-caption">${esc(c.id)} · ${bandLabel(c.bandId)} 표본 배치</p>${gaps.map(g=>`<div class="me-gap"><strong>${esc(g.title)}</strong><p>${esc(g.description)}</p></div>`).join('')}<p class="me-caption">관계 채택·수정은 별도 변경 제안 계약의 대상입니다. 이 화면은 읽기와 탐색만 수행합니다.</p>`;}return `<aside class="me-inspector" aria-label="선택한 개념 상세"><div class="me-inspector-head"><div><strong>${esc(c.title)}</strong><div class="me-caption">${esc(c.id)}</div></div>${btn('clear','','닫기','me-close')}</div><div class="me-tabs" aria-label="개념 상세 보기">${[['concept','개념'],['relations','관계'],['review','검토']].map(([id,label])=>btn('inspect-tab',id,label,'',`aria-pressed="${state.tab===id}"`)).join('')}</div><div class="me-inspector-body">${body}</div></aside>`;}
function draw(){const canvas=root.querySelector('.me-canvas'),svg=root.querySelector('.me-edge-svg');if(!canvas||!svg)return;const box=canvas.getBoundingClientRect();if(!box.width||!box.height)return;svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);const nodes=new Map([...canvas.querySelectorAll('[data-node]')].map(n=>[n.dataset.node,n]));const paths=source.dependencyEdges.filter(e=>state.visibleRelations.has(e.edgeType)&&nodes.has(e.fromId)&&nodes.has(e.toId)).map(e=>{const a=nodes.get(e.fromId).getBoundingClientRect(),b=nodes.get(e.toId).getBoundingClientRect();const ax=a.left-box.left+a.width/2,ay=a.top-box.top+a.height/2,bx=b.left-box.left+b.width/2,by=b.top-box.top+b.height/2,dx=bx-ax,dy=by-ay;if(!dx&&!dy)return '';const ra=Math.min(dx?a.width/2/Math.abs(dx):Infinity,dy?a.height/2/Math.abs(dy):Infinity),rb=Math.min(dx?b.width/2/Math.abs(dx):Infinity,dy?b.height/2/Math.abs(dy):Infinity);const x1=ax+dx*ra,y1=ay+dy*ra,x2=bx-dx*rb,y2=by-dy*rb,mid=(y1+y2)/2;const r=relations.get(e.edgeType);return `<path class="me-edge ${(state.conceptId===e.fromId||state.conceptId===e.toId)?'me-highlight':''}" data-style="${r.lineStyle}" d="M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}" ${r.directedVisual?'marker-end="url(#me-arrow-r2)"':''}/>`;}).join('');svg.innerHTML='<defs><marker id="me-arrow-r2" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L6,3.5 L1,6" fill="none" stroke="currentColor" stroke-width="1.3"/></marker></defs>'+paths;}
function render(){headingPath();view.innerHTML=!state.domainId?overview():!state.topicId?domainView():graph();live.textContent=state.conceptId?concepts.get(state.conceptId).title+' 선택':state.topicId?topics.get(state.topicId).title+' 개념 지도':state.domainId?domains.get(state.domainId).label+' 영역':'전체 지도';requestAnimationFrame(draw);}
function searchHits(){const q=state.query.trim().normalize('NFKC').toLowerCase();if(!q)return [];const hits=[];for(const c of concepts.values()){if(!inBand(c))continue;const fields=[{value:c.title,kind:'개념',atomId:null},...c.terms.map(a=>({value:a.label,kind:'용어',atomId:a.id})),...c.symbols.map(a=>({value:a.notation,kind:'기호',atomId:a.id}))];let hit=null;for(const f of fields){const text=f.value.normalize('NFKC').toLowerCase();const score=text===q?3:text.startsWith(q)?2:text.includes(q)?1:0;if(score&&(!hit||score>hit.score))hit={conceptId:c.id,conceptTitle:c.title,match:f.value,kind:f.kind,atomId:f.atomId,score};}if(hit)hits.push(hit);}return hits.sort((a,b)=>b.score-a.score||a.conceptTitle.localeCompare(b.conceptTitle,'ko')).slice(0,config.interaction.searchResultLimit);}
function renderSearch(){const hits=searchHits();state.searchIndex=Math.max(0,Math.min(state.searchIndex,hits.length-1));results.innerHTML=!state.query.trim()?'':hits.length?hits.map((h,i)=>btn('search-result',h.conceptId,`<span><strong>${esc(h.conceptTitle)}</strong><br><span class="me-result-match">${esc(h.kind+' · '+h.match)}</span></span><span class="me-result-match">${esc(topics.get(concepts.get(h.conceptId).canonicalParentId).title)} →</span>`,'me-search-result',`data-hit="${i}" aria-pressed="${i===state.searchIndex}"`)).join(''):'<p class="me-empty">검색 결과가 없습니다.</p>';search.setAttribute('aria-expanded',String(Boolean(state.query.trim())));live.textContent=state.query.trim()?hits.length+'개 검색 결과'+(hits.length?', '+hits[state.searchIndex].conceptTitle+' 선택':''):'';}
function clearSearch(){state.query='';state.searchIndex=0;search.value='';renderSearch();}
function selectConcept(id,atom=null){if(!concepts.has(id))return;const c=concepts.get(id);if(!inBand(c)){state.bandId='all';band.value='all';}state.conceptId=id;state.topicId=c.canonicalParentId;state.domainId=domainOfTopic(c.canonicalParentId).id;state.atomId=atom;state.tab='concept';state.page=0;}
function navigate(action,id,hitIndex){if(!allowedActions.has(action))return;if(action==='home'){state.domainId=null;state.topicId=null;state.conceptId=null;}else if(action==='back'){if(state.conceptId)state.conceptId=null;else if(state.topicId)state.topicId=null;else state.domainId=null;}else if(action==='domain'&&domains.has(id)){state.domainId=id;state.topicId=null;state.conceptId=null;}else if(action==='topic'&&topics.has(id)){state.topicId=id;state.domainId=domainOfTopic(id).id;state.conceptId=null;}else if(action==='concept')selectConcept(id);else if(action==='clear')state.conceptId=null;else if(action==='inspect-tab'&&['concept','relations','review'].includes(id))state.tab=id;else if(action==='search-result'){const hit=searchHits()[Number(hitIndex)];if(hit)selectConcept(hit.conceptId,hit.atomId);clearSearch();}else return;state.page=0;render();const focusTarget=state.conceptId?root.querySelector('[data-action="clear"]'):root.querySelector('[data-node]')||root.querySelector('[data-action="topic"]')||root.querySelector('[data-action="domain"]');if(focusTarget)focusTarget.focus({preventScroll:true});}
root.addEventListener('click',e=>{const button=e.target.closest('button');if(!button||!root.contains(button))return;if(button.dataset.action)navigate(button.dataset.action,button.dataset.id,button.dataset.hit);else if(button.dataset.page!==undefined){state.page=Math.max(0,Number(button.dataset.page));state.conceptId=null;render();}});
root.addEventListener('change',e=>{if(e.target===band){state.bandId=band.value;state.domainId=null;state.topicId=null;state.conceptId=null;state.page=0;clearSearch();render();}else if(e.target.dataset.relation&&relations.has(e.target.dataset.relation)){const id=e.target.dataset.relation;if(e.target.checked)state.visibleRelations.add(id);else state.visibleRelations.delete(id);render();const target=root.querySelector('[data-relation="'+id+'"]');if(target)target.focus({preventScroll:true});}});
search.addEventListener('input',()=>{state.query=search.value;state.searchIndex=0;renderSearch();});
root.addEventListener('keydown',e=>{if(e.target===search){if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=searchHits().length;if(n)state.searchIndex=(state.searchIndex+(e.key==='ArrowDown'?1:-1)+n)%n;renderSearch();}else if(e.key==='Enter'&&searchHits().length){e.preventDefault();navigate('search-result',null,state.searchIndex);}else if(e.key==='Escape'){e.preventDefault();clearSearch();search.blur();}return;}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){e.preventDefault();search.focus();}else if(e.key==='Escape'){e.preventDefault();if(state.query)clearSearch();else navigate('back');}else if(e.target.dataset?.node&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const nodes=[...root.querySelectorAll('[data-node]')],i=nodes.indexOf(e.target),delta=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;nodes[(i+delta+nodes.length)%nodes.length]?.focus();}});
if(typeof ResizeObserver==='function')new ResizeObserver(draw).observe(view);
/* TEST_HOOK */
render();
})();

</script>
</div>
